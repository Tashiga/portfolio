<nav
  class="sticky relative top-0 left-0 w-full z-50 bg-gray-900 text-white
         transition-all duration-300 motion-reduce:transition-none"
>
  <div
    class="max-w-6xl mx-auto px-4 sm:px-6 h-16
           flex items-center justify-between"
  >
    <a
      routerLink="/"
      class="flex items-center text-xl sm:text-2xl font-bold text-white
             whitespace-nowrap"
      (click)="closeMenu()"
    >
      {{ 'portfolio-title' | translate }}
    </a>
    <ul class="hidden md:flex items-center gap-6 font-semibold">
      <li>
        <button
          type="button"
          class="nav-link"
          (click)="scrollToItem('portfolio')"
        >
          {{ 'navbar.profil' | translate }}
        </button>
      </li>
      <li>
        <button
          type="button"
          class="nav-link"
          (click)="scrollToItem('parcours')"
        >
          {{ 'navbar.parcours' | translate }}
        </button>
      </li>
      <li>
        <button
          type="button"
          class="nav-link"
          (click)="scrollToItem('skills')"
        >
          {{ 'navbar.skills' | translate }}
        </button>
      </li>
      <li>
        <button
          type="button"
          class="nav-link"
          (click)="scrollToItem('experiences')"
        >
          {{ 'navbar.exp' | translate }}
        </button>
      </li>
    </ul>
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <button
          *ngFor="let lang of languages"
          type="button"
          class="language-button"
          [attr.aria-label]="('language.' + lang | translate)"
          (click)="setLanguage(lang)"
        >
          <img
            [src]="'assets/flags/' + lang + '.svg'"
            [alt]="lang"
            class="w-6 h-6 transition duration-200"
            [ngClass]="{
              'opacity-40 grayscale': currentLang !== lang
            }"
          />
        </button>
      </div>
      <button
        type="button"
        class="md:hidden flex items-center justify-center
               w-10 h-10 rounded-lg
               hover:bg-gray-800 transition"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Menu"
      >
        <svg
          *ngIf="!isMenuOpen"
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
        <svg
          *ngIf="isMenuOpen"
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>
  <div
    *ngIf="isMenuOpen"
    class="absolute top-full left-0 w-full md:hidden
         border-t border-gray-700 bg-gray-900
         shadow-lg z-50"
  >
    <ul class="px-4 py-3 flex flex-col">
      <li>
        <button
          type="button"
          class="mobile-nav-link"
          (click)="navigateTo('portfolio')"
        >
          {{ 'navbar.profil' | translate }}
        </button>
      </li>
      <li>
        <button
          type="button"
          class="mobile-nav-link"
          (click)="navigateTo('parcours')"
        >
          {{ 'navbar.parcours' | translate }}
        </button>
      </li>
      <li>
        <button
          type="button"
          class="mobile-nav-link"
          (click)="navigateTo('skills')"
        >
          {{ 'navbar.skills' | translate }}
        </button>
      </li>
      <li>
        <button
          type="button"
          class="mobile-nav-link"
          (click)="navigateTo('experiences')"
        >
          {{ 'navbar.exp' | translate }}
        </button>
      </li>
    </ul>
  </div>
</nav>
