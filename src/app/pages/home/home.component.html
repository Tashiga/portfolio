<div class="full-bleed min-h-screen w-full flex flex-col justify-center items-center text-white px-5 sm:px-8" #container>
  <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-center mb-4 leading-tight intro-title" >
    {{ 'home.welcome' | translate }}
  </h1>
  <p class="text-base sm:text-lg md:text-xl text-center max-w-xl leading-relaxed intro-subtitle" >
    {{ 'home.intro' | translate }}
  </p>
  <button class="mt-8 px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-xl text-white text-base sm:text-lg font-semibold transition-all duration-300 intro-button" (click)="scrollToPortfolio()" >
    {{ 'home.discover' | translate }}
  </button>
</div>
<div id="portfolio" class="w-full">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div id="mobile-profile" class="md:hidden pt-16">
      <app-profil></app-profil>
    </div>
    <div class="md:flex md:items-start md:gap-6 lg:gap-8">
      <aside class="hidden md:block md:sticky md:top-[25vh] md:w-[300px] lg:w-[350px] md:flex-shrink-0 h-fit" >
        <app-profil></app-profil>
      </aside>
      <div class="w-full min-w-0 pt-8 md:pt-16 pb-20" #sections >
        <app-about></app-about>
        <app-journey></app-journey>
        <app-skills></app-skills>
        <app-professional-experience></app-professional-experience>
      </div>
    </div>
  </div>
</div>
<button *ngIf="!atTop" (click)="scrollToTop()" class="fixed bottom-5 right-5 sm:bottom-6 sm:right-6 z-40 w-11 h-11 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-blue-600 hover:bg-blue-700 text-white text-2xl shadow-lg transition-all duration-300" aria-label="Retour en haut" >
  ↑
</button>
